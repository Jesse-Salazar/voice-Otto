<!doctype html>
<title>Hypothetical post-accept proposal layout with sibling controls</title>
<div class="project-management specs">
  <section class="project-specs">
    <div class="project-info post-offer">
      <form id="post-offer-form" class="formkit-form"><label>Proposal text <input></label></form>
      <div class="form-content">
        <div class="vdl-uploader">
          <div class="upload-box-container">
            <div class="upload-box">Audio attachment</div>
            <input type="file" accept="audio/*">
          </div>
        </div>
      </div>
      <div class="submit-options"><button type="button">Save Draft</button><button type="button" id="submit">Submit</button></div>
      <div class="result"></div>
    </div>
  </section>
</div>
