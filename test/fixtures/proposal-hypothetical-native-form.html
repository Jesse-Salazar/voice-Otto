<!doctype html>
<title>Hypothetical post-accept proposal layout with native form ownership</title>
<div class="project-management specs">
  <section class="project-specs">
    <div class="project-info post-offer">
      <form id="post-offer-form">
        <div class="form-content">
          <div class="vdl-uploader">
            <div class="upload-box-container">
              <div class="upload-box">Audio attachment</div>
              <input type="file" accept=".mp3,audio/mpeg">
            </div>
          </div>
        </div>
        <div class="submit-options"><button type="submit" id="submit">Submit</button></div>
      </form>
    </div>
  </section>
</div>
